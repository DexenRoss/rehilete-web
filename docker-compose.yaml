version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: rehilete-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rehilete
      POSTGRES_PASSWORD: rehilete123
      POSTGRES_DB: rehilete_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: